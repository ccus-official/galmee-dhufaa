<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Galmee Dhufaa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2EE; --surface:#FFFFFF; --ink:#16313F; --muted:#5B6F78; --line:#D3DDD6;
  --present:#2E7D4F; --present-bg:#DDF0E3;
  --absent:#BF3B25; --absent-bg:#F9DDD7;
  --late:#9A6B00; --late-bg:#FBEBB8;
  --accent:#1A67A9; --accent-ink:#FFFFFF; --focus:#1B6FD1;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Abyssinica SIL",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B22; --surface:#172830; --ink:#E6EFEA; --muted:#97AAB1; --line:#2A3F49;
    --present:#6CCB8D; --present-bg:#1C3A2A; --absent:#FF8F78; --absent-bg:#432119;
    --late:#F2C94C; --late-bg:#40330D; --accent:#E6EFEA; --accent-ink:#0F1B22; --focus:#6AB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B22; --surface:#172830; --ink:#E6EFEA; --muted:#97AAB1; --line:#2A3F49;
  --present:#6CCB8D; --present-bg:#1C3A2A; --absent:#FF8F78; --absent-bg:#432119;
  --late:#F2C94C; --late-bg:#40330D; --accent:#E6EFEA; --accent-ink:#0F1B22; --focus:#6AB0FF;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-text-size-adjust:100%}
h1,h2{font-family:var(--font);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{padding:18px 0 8px}
header h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
header p{margin:2px 0 10px;color:var(--muted);font-size:15px}
.prefs{display:flex;gap:8px}
.prefs label{flex:1;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.prefs select{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 8px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);margin-top:8px}
nav button{flex:1;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:10px;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{display:flex;gap:10px;margin:16px 0 8px;flex-wrap:wrap}
.bar>label{flex:1 1 140px;display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.bar select,.bar input{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;width:100%}
.bar>label.dl{flex:1 1 100%}
.dsel{display:grid;grid-template-columns:68px minmax(0,1fr) 88px;gap:6px}
.dsel select{padding:0 6px;font-size:15px}
.counts{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.chip b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.chip.p{background:var(--present-bg);color:var(--present)}
.chip.a{background:var(--absent-bg);color:var(--absent)}
.chip.l{background:var(--late-bg);color:var(--late)}
.tools{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:8px}
.tools .saved{font-size:13px;color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--absent);border-color:var(--absent);color:#fff}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .nm{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.row .nm span:last-child{color:var(--muted);font-weight:400;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:46px;border-radius:9px;border:1.5px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
.seg button[data-s="P"][aria-pressed="true"]{background:var(--present-bg);border-color:var(--present);color:var(--present)}
.seg button[data-s="A"][aria-pressed="true"]{background:var(--absent-bg);border-color:var(--absent);color:var(--absent)}
.seg button[data-s="L"][aria-pressed="true"]{background:var(--late-bg);border-color:var(--late);color:var(--late)}
.sms{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sms .btn{min-height:40px;padding:0 12px;font-size:14px;width:100%}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-top:16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:10px}
.card textarea,.card input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;min-height:46px}
.card textarea{min-height:110px;resize:vertical}
.card>.btn{margin-top:10px;width:100%}
.card .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .btn{min-height:40px;padding:0 12px}
.rep{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.pct{font-weight:800;font-size:22px}
.pct.low{color:var(--absent)}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .mp{background:var(--present)}.meter .ml{background:var(--late)}.meter .ma{background:var(--absent)}
.small{font-size:13px;color:var(--muted)}
.note{background:var(--late-bg);color:var(--late);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.ok{background:var(--present-bg);color:var(--present);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.err{background:var(--absent-bg);color:var(--absent);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.fld input,.fld select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;margin-top:4px;color:var(--ink)}
.card summary{min-height:32px}
#cstat{font-size:13px;color:var(--present);margin:-4px 0 8px;font-weight:600}
nav{gap:4px}
nav button{font-size:14px;padding:0 2px}
.seg button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:10px;min-height:40px}
.chk input{width:22px;height:22px;flex:none}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.14em;text-align:center;padding:10px;background:var(--bg);border-radius:10px;border:1px dashed var(--line);user-select:all}

#printArea{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  html,body{background:#fff!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;color:#000;background:#fff;font:11px/1.35 system-ui,"Noto Sans","Noto Sans Ethiopic",sans-serif}
  #printArea table{border-collapse:collapse;width:100%}
  #printArea th,#printArea td{border:1px solid #444;padding:2px 4px;text-align:center}
  #printArea td.n,#printArea th.n{text-align:left;white-space:nowrap}
  #printArea td.a{font-weight:700}
}
nav.n5 button{font-size:13px;padding:0 2px}

/* ---------- Login (design: GD badge, tabs, labeled fields) ---------- */
:root{--lg-bg:#F3F6FB;--lg-card:#FFFFFF;--lg-line:#E3E7EE;--lg-ink:#111827;--lg-muted:#6B7280;--lg-blue:#1A67A9;--lg-tab:#EDF1F6;--lg-tabink:#5F6B7A;--lg-ph:#7B828D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lg-bg:#0F1B22;--lg-card:#172830;--lg-line:#2A3F49;--lg-ink:#E6EFEA;--lg-muted:#97AAB1;--lg-blue:#5AA7EA;--lg-tab:#223640;--lg-tabink:#A9BCC4;--lg-ph:#7F949C}}
:root[data-theme="dark"]{--lg-bg:#0F1B22;--lg-card:#172830;--lg-line:#2A3F49;--lg-ink:#E6EFEA;--lg-muted:#97AAB1;--lg-blue:#5AA7EA;--lg-tab:#223640;--lg-tabink:#A9BCC4;--lg-ph:#7F949C}
header h1{color:var(--lg-blue)}
body.loginview{background:var(--lg-bg)}
body.loginview header,body.loginview nav{display:none}
.login{min-height:92vh;min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.lgc{background:var(--lg-card);border:1px solid var(--lg-line);border-radius:22px;padding:22px 18px 20px;box-shadow:0 18px 45px rgba(20,40,70,.10)}
.lgbadge{width:66px;height:66px;border-radius:16px;background:var(--lg-blue);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin:2px auto 14px;letter-spacing:.01em}
.lgtitle{margin:0;text-align:center;font-size:28px;font-weight:800;color:var(--lg-blue);letter-spacing:-.01em}
.lgsub{margin:4px 0 18px;text-align:center;color:var(--lg-muted);font-size:15px}
.lgtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.lgtab{min-height:46px;border:0;border-radius:11px;background:var(--lg-tab);color:var(--lg-tabink);font-weight:700;font-size:16px;cursor:pointer}
.lgtab[aria-selected="true"]{background:var(--lg-blue);color:#fff}
.lglabel{display:block;margin:16px 0 6px;font-weight:700;color:var(--lg-ink);font-size:15px}
.lginput{width:100%;min-height:48px;border:1px solid var(--lg-line);border-radius:12px;background:var(--lg-card);color:var(--lg-ink);padding:0 14px;font-size:16px}
.lginput::placeholder{color:var(--lg-ph)}
.lgbtn{width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;background:var(--lg-blue);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.lglink{display:block;width:100%;margin:12px auto 0;min-height:40px;border:0;background:none;color:var(--lg-blue);font-weight:600;font-size:15px;cursor:pointer}
.lghint{margin:14px 0 0;color:var(--lg-muted);font-size:13px;text-align:center}
.lgc .err,.lgc .ok{margin:12px 0 0}
.lglang{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:14px}
.lglang .lglink{display:inline-block;width:auto;margin:0;padding:0 4px;color:var(--lg-muted);font-weight:500}
.lglang .lglink[aria-current="true"]{color:var(--lg-blue);font-weight:800}
.lgc input:focus-visible,.lgc button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.rolepick{display:grid;gap:8px;margin:2px 0}
.rolebtn{display:block;width:100%;text-align:left;padding:11px 14px;border:2px solid var(--lg-line);border-radius:14px;background:var(--lg-card);color:var(--lg-ink);cursor:pointer;font:inherit}
.rolebtn b{display:block;font-size:16px}
.rolebtn small{display:block;color:var(--lg-muted);font-size:13px;margin-top:2px;line-height:1.35}
.rolebtn[aria-pressed="true"]{border-color:var(--lg-blue);background:var(--lg-tab)}
.rolebtn.t[aria-pressed="true"]{border-color:var(--present);background:var(--present-bg)}
.rolebtn.a[aria-pressed="true"]{border-color:var(--muted)}
.rolecard{border-left:6px solid var(--lg-blue)}
.rolecard.t{border-left-color:var(--present)}
.rolecard.a{border-left-color:var(--muted)}
.rchip{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:20px;border:1.5px solid var(--lg-blue);color:var(--lg-blue);background:var(--lg-tab)}
.rchip.t{border-color:var(--present);color:var(--present);background:var(--present-bg)}
</style>

function gToJDN(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}

/* ---------- Ripoortii baasuu / Export ---------- */
var exPeriod="all",exMsg="";
function periodRange(p,calOv){
  var td=todayIso();
  if(p==="all")return ["0000-00-00","9999-99-99"];
  if(p==="last30"){var tp=td.split("-"),g=jdnToG(gToJDN(+tp[0],+tp[1],+tp[2])-29);return [g.y+"-"+pad(g.m)+"-"+pad(g.d),td]}
  var off=p==="lastMonth"?-1:0;
  if((calOv||state.settings.cal)==="eth"){
    var e=isoToE(td),y=e.y,m=e.m+off;
    if(m<1){m=13;y--}
    return [eToIso(y,m,1),eToIso(y,m,daysIn(y,m))];
  }
  var tq=td.split("-"),y2=+tq[0],m2=+tq[1]+off;
  if(m2<1){m2=12;y2--}
  return [y2+"-"+pad(m2)+"-01",y2+"-"+pad(m2)+"-"+pad(new Date(y2,m2,0).getDate())];
}
function periodText(rg){
  var t=L(),n=exPeriod==="all"?t.exAll:exPeriod==="thisMonth"?t.exThis:exPeriod==="lastMonth"?t.exLast:t.exL30;
  return exPeriod==="all"?n:n+" ("+fmtDate(rg[0])+" - "+fmtDate(rg[1])+")";
}
function classData(c,rg){
  var dates=Object.keys(state.records).filter(function(k){return k.indexOf(c.id+"|")===0}).map(function(k){return k.split("|")[1]})
    .filter(function(d){return d>=rg[0]&&d<=rg[1]}).sort();
  var rows=c.students.map(function(s){
    var P=0,A=0,Lt=0;
    var cells=dates.map(function(d){
      var v=(state.records[c.id+"|"+d]||{})[s.id]||"";
      if(v==="P")P++;else if(v==="A")A++;else if(v==="L")Lt++;else v="";
      return v;
    });
    var tot=P+A+Lt;
    return {s:s,cells:cells,P:P,A:A,L:Lt,tot:tot,pct:tot?Math.round((P+Lt)/tot*100):null};
  });
  return {dates:dates,rows:rows};
}
function csvCell(v){v=String(v==null?"":v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvLine(a){return a.map(csvCell).join(",")}
function mcode(v){var t=L();return v==="P"?t.exP:v==="A"?t.exA:v==="L"?t.exL:""}
function sexText(s){var t=L();return s.sex==="M"?t.male:s.sex==="F"?t.female:""}
function shortDate(iso){
  if(state.settings.cal==="eth"){var e=isoToE(iso);return e.d+"/"+e.m}
  var p=iso.split("-");return (+p[2])+"/"+(+p[1]);
}
function classCsv(c,rg){
  var t=L(),d=classData(c,rg),out=[];
  out.push(csvLine([t.title]));
  if(cloudMode&&cloud.schoolName)out.push(csvLine([t.exSchool,cloud.schoolName]));
  out.push(csvLine([t.klass,c.name]));
  out.push(csvLine([t.exPeriod,periodText(rg)]));
  out.push(csvLine([t.exLegend,t.exP+"="+t.P+", "+t.exL+"="+t.L+", "+t.exA+"="+t.A]));
  out.push(csvLine([t.exMade,fmtStamp(Date.now())]));
  out.push("");
  out.push(csvLine(["#",t.name,t.sex,t.age].concat(d.dates.map(fmtDate),[t.P,t.L,t.A,t.exDays,t.exAtt])));
  d.rows.forEach(function(r,i){
    out.push(csvLine([i+1,r.s.name,sexText(r.s),r.s.age||""].concat(r.cells.map(mcode),[r.P,r.L,r.A,r.tot,r.pct==null?"":r.pct])));
  });
  var present=d.dates.map(function(x,j){var n=0;d.rows.forEach(function(r){if(r.cells[j]==="P"||r.cells[j]==="L")n++});return n});
  out.push(csvLine(["",t.exTotalP,"",""].concat(present)));
  return out.join("\r\n");
}
function summaryCsv(rg){
  var t=L(),out=[];
  out.push(csvLine([t.title]));
  if(cloudMode&&cloud.schoolName)out.push(csvLine([t.exSchool,cloud.schoolName]));
  out.push(csvLine([t.exPeriod,periodText(rg)]));
  out.push(csvLine([t.exMade,fmtStamp(Date.now())]));
  out.push("");
  out.push(csvLine([t.klass,t.exStu,t.male,t.female,t.exDays,t.exAtt,t.male+" %",t.female+" %"]));
  var tot={n:0,m:0,f:0,pl:0,all:0,mpl:0,mall:0,fpl:0,fall:0};
  state.classes.forEach(function(c){
    var d=classData(c,rg),m=0,f=0,pl=0,all=0,mpl=0,mall=0,fpl=0,fall=0;
    d.rows.forEach(function(r){
      if(r.s.sex==="M")m++;else if(r.s.sex==="F")f++;
      var a=r.P+r.L,b=r.tot;pl+=a;all+=b;
      if(r.s.sex==="M"){mpl+=a;mall+=b}else if(r.s.sex==="F"){fpl+=a;fall+=b}
    });
    function pc(a,b){return b?Math.round(a/b*100):""}
    out.push(csvLine([c.name,c.students.length,m,f,d.dates.length,pc(pl,all),pc(mpl,mall),pc(fpl,fall)]));
    tot.n+=c.students.length;tot.m+=m;tot.f+=f;tot.pl+=pl;tot.all+=all;tot.mpl+=mpl;tot.mall+=mall;tot.fpl+=fpl;tot.fall+=fall;
  });
  function pc2(a,b){return b?Math.round(a/b*100):""}
  out.push(csvLine([t.exTotal,tot.n,tot.m,tot.f,"",pc2(tot.pl,tot.all),pc2(tot.mpl,tot.mall),pc2(tot.fpl,tot.fall)]));
  return out.join("\r\n");
}
function safeName(s){return String(s).replace(/[^A-Za-z0-9\u1200-\u137F_-]+/g,"_").replace(/^_+|_+$/g,"")||"kutaa"}
function downloadText(name,text){

}

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.admp&&cloud.adm){cloud.adm.period=t.value;render();return}
  if(t.dataset.assign){cloudAssign(t.dataset.assign,t.dataset.uid,t.checked);return}
  if(t.dataset.exp){exPeriod=t.value;exMsg="";render();return}
  if(t.dataset.pref==="lang"){state.settings.lang=t.value;save();render();return}
  if(t.dataset.pref==="cal"){state.settings.cal=t.value;save();render();return}
  if(t.dataset.change==="class"){state.current=t.value;save();confirmId=null;render();return}
  if(t.dataset.gdate&&t.value){date=t.value<START_ISO?START_ISO:(t.value>END_ISO?END_ISO:t.value);render();return}
  if(t.dataset.edate){
    var e0=isoToE(date),y=e0.y,m=e0.m,d=e0.d;
    if(t.dataset.edate==="y")y=+t.value;
    if(t.dataset.edate==="m")m=+t.value;
    if(t.dataset.edate==="d")d=+t.value;
    d=Math.min(d,daysIn(y,m));
    date=eToIso(y,m,d);if(date<START_ISO)date=START_ISO;if(date>END_ISO)date=END_ISO;render();
  }
});

var sumT=null;
function pctOf(a,b){return b?Math.round(a/b*100):null}
function computeSummary(){
  var pr={all:periodRange("all","eth"),thisMonth:periodRange("thisMonth","eth"),lastMonth:periodRange("lastMonth","eth"),last30:periodRange("last30","eth")};
  var cl=state.classes,stu=0,m=0,f=0,last="",periods={};
  cl.forEach(function(c){c.students.forEach(function(s){stu++;if(s.sex==="M")m++;else if(s.sex==="F")f++})});
  Object.keys(state.records).forEach(function(k){
    var mk=state.records[k];
    if(mk&&Object.keys(mk).length){var d=k.split("|")[1];if(d>last)last=d}
  });
  Object.keys(pr).forEach(function(k){
    var rg=pr[k],days={},pl=0,t=0,mpl=0,mt=0,fpl=0,ft=0;
    cl.forEach(function(c){
      var d=classData(c,rg);
      d.dates.forEach(function(x){days[x]=1});
      d.rows.forEach(function(r){
        var a=r.P+r.L,b=r.tot;pl+=a;t+=b;
        if(r.s.sex==="M"){mpl+=a;mt+=b}else if(r.s.sex==="F"){fpl+=a;ft+=b}
      });
    });
    periods[k]={d:Object.keys(days).length,pl:pl,t:t,mpl:mpl,mt:mt,fpl:fpl,ft:ft};
  });
  return {classes:cl.length,students:stu,male:m,female:f,lastDate:last,periods:periods};
}
function schedulePublish(){

function publishSummary(){

}

  if(cloud.role==="teacher"&&!state.classes.length)out+='<div class="note">'+t.pendingT+'</div>';
  if(localState.classes.length&&!localState.migrated&&!isTeacher())
    out+='<div class="card"><h2>'+t.migT+'</h2><p class="small" style="margin-top:0">'+t.migX(localState.classes.length)+'</p><button class="btn" data-act="cmigrate">'+t.migBtn+'</button></div>';
  if(cloud.role==="principal"){
    var tl=cloud.members.filter(function(m){return m.role==="teacher"});
    out+='<div class="card"><h2>'+t.teachers+'</h2>'+(tl.length?tl.map(function(m){
      var ask=confirmId==="t"+m.uid;
      return '<div class="item" style="display:block"><b>'+esc(m.name||m.email)+'</b><div class="small">'+esc(m.email)+'</div>'+
        (state.classes.length?'<div class="small" style="margin-top:6px">'+t.assign+'</div>':'')+
        state.classes.map(function(c){return '<label class="chk"><input type="checkbox" data-assign="'+c.id+'" data-uid="'+m.uid+'"'+(c.teacherUids.indexOf(m.uid)>=0?' checked':'')+'> '+esc(c.name)+'</label>'}).join("")+
        '<button class="btn '+(ask?'danger':'ghost')+'" style="margin-top:8px;min-height:40px" data-act="rmteacher" data-uid="'+m.uid+'">'+(ask?t.sure:t.removeT)+'</button></div>';
    }).join(""):'<p class="small" style="margin:0">'+t.noTeachers+'</p>')+'</div>';
  }
  return out+signout;
}

document.addEventListener("input",function(e){
  if(!app.contains(e.target))return;
  var er=document.getElementById("cerr");
  if(er){cloud.errMsg=null;er.remove()}
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var id=e.target&&e.target.id;
  if(id==="cEmail"||id==="cPass"||id==="cName"){
    var b=app.querySelector('button[data-act="csignin"],button[data-act="csignup"]');
    if(b){e.preventDefault();b.click()}
  }
});
render();
try{if(!localOnly||localStorage.getItem("galmee-cloud")==="1")ensureCloud()}catch(e){ensureCloud()}

/* ---------- Interneet malee / Offline (PWA) ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}});
}
})();
</script>
</body>
